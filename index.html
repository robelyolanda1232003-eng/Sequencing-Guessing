<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生命科学学院2026本科生毕业典礼</title>
    <script src="https://unpkg.com/hydrogen-js-sdk/dist/Bmob-2.5.2.min.js"></script>
    <style>
        :root { --primary-color: #2c3e50; --accent-color: #27ae60; --bg-color: #f4f7f6; --disabled-color: #bdc3c7; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); color: var(--primary-color); max-width: 800px; margin: 0 auto; padding: 20px; }
        h1, h2 { text-align: center; }
        .card { background: white; border-radius: 10px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-family: monospace; }
        
        button { background-color: var(--accent-color); color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; width: 100%; transition: background-color 0.3s; font-weight: bold; }
        button:hover:not(:disabled) { background-color: #219653; }
        button:disabled { background-color: var(--disabled-color); cursor: not-allowed; }
        
        /* 修复：彩球容器允许换行 */
        .balls-container { display: flex; justify-content: center; gap: 10px; margin: 30px 0; min-height: 60px; flex-wrap: wrap; }
        /* 修复：flex-shrink 防止彩球被挤扁 */
        .ball { width: 50px; height: 50px; border-radius: 50%; background: linear-gradient(135deg, #3498db, #2980b9); color: white; font-size: 24px; font-weight: bold; display: flex; align-items: center; justify-content: center; box-shadow: inset -3px -3px 6px rgba(0,0,0,0.2), 3px 3px 6px rgba(0,0,0,0.2); opacity: 0; transform: scale(0.5); transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); flex-shrink: 0; }
        .ball.show { opacity: 1; transform: scale(1); }
        .ball.A { background: linear-gradient(135deg, #e74c3c, #c0392b); }
        .ball.T { background: linear-gradient(135deg, #f1c40f, #f39c12); }
        .ball.C { background: linear-gradient(135deg, #2ecc71, #27ae60); }
        .ball.G { background: linear-gradient(135deg, #3498db, #2980b9); }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #ecf0f1; }
        /* 修复：强制序列号不换行 */
        .seq-font { font-family: 'Courier New', Courier, monospace; letter-spacing: 1px; white-space: nowrap; }
        .tabs { display: flex; gap: 10px; margin-bottom: 10px; }
        .tab-btn { background-color: #ecf0f1; color: var(--primary-color); width: auto; }
        .tab-btn.active { background-color: var(--primary-color); color: white; }

        /* 新增：表格防溢出保护壳 */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin-top: 10px;
        }

        /* 新增：手机小屏幕专属优化 */
        @media screen and (max-width: 500px) {
            .balls-container { gap: 6px; }
            .ball { width: 34px; height: 34px; font-size: 18px; }
        }
    </style>
</head>
<body>

    <h1>🧬 序列竞猜大挑战</h1>

    <div class="card" id="submitSection">
        <h2>自定义序列提交</h2>
        <div class="form-group"><label>姓名</label><input type="text" id="inputName"></div>
        <div class="form-group"><label>学号/工号</label><input type="text" id="inputId"></div>
        <div class="form-group">
            <label>自定义 ssDNA (严格 9nt)</label>
            <input type="text" id="inputSeq" maxlength="9" style="text-transform: uppercase;" placeholder="例如：GCGTATGCG">
        </div>
        <button id="submitBtn" onclick="submitSequence()">提交我的序列</button>
        <p id="submitMsg" style="text-align: center; margin-top: 10px; font-weight: bold; word-break: break-all;"></p>
    </div>

    <div class="card">
        <h2>现场最终序列开奖</h2>
        
        <div id="adminControls" style="display: none;">
            <p id="adminStatus" style="color:#2980b9; font-weight:bold;">正在连接 Bmob 云端数据库...</p>
            <button id="drawBtn" onclick="adminStartDraw()" disabled>🎲 读取云端数据并开奖</button>
        </div>
        
        <div id="participantWait" style="text-align: center; color: #e74c3c; font-weight: bold;">
            <p id="waitText">⏳ 序列将加密上传至云端。请留意现场大屏幕，开奖后将同步结果...</p>
        </div>

        <div class="balls-container" id="ballsContainer"></div>
    </div>

    <div class="card" id="resultSection" style="display: none;">
        <h2>同源性排行榜</h2>
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('high')" id="tabHigh">最高同源性</button>
            <button class="tab-btn" onclick="switchTab('low')" id="tabLow">最低同源性</button>
        </div>
        <div class="table-responsive">
            <table id="resultTable">
                <thead><tr><th>排名</th><th>姓名</th><th>学号/工号</th><th>提交序列</th><th>同源性</th></tr></thead>
                <tbody id="resultBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        // 初始化 Bmob
        Bmob.initialize("09e593fe93bdd646", "20040716");

        let currentResults = [];
        let finalSequence = "";
        let syncTimer = null;
        let isAdmin = false;

        function initPage() {
            const urlParams = new URLSearchParams(window.location.search);
            isAdmin = urlParams.get('admin') === 'true';

            if (isAdmin) {
                document.getElementById('adminControls').style.display = 'block';
                document.getElementById('participantWait').style.display = 'none';
                checkAdminStatus();
            } else {
                document.getElementById('adminControls').style.display = 'none';
                document.getElementById('participantWait').style.display = 'block';
                syncTimer = setInterval(checkGameStatusFromCloud, 3000);
            }
            checkGameStatusFromCloud();
        }

        async function submitSequence() {
            const name = document.getElementById('inputName').value.trim();
            const id = document.getElementById('inputId').value.trim();
            let seq = document.getElementById('inputSeq').value.trim().toUpperCase();
            const msgEl = document.getElementById('submitMsg');
            const btn = document.getElementById('submitBtn');

            if (!name || !id || !seq || seq.length !== 9 || !/^[ATCG]+$/.test(seq)) {
                alert("输入无效，请检查信息格式！"); return;
            }

            btn.disabled = true;
            btn.innerText = "上传云端中...";

            try {
                let statusRes = [];
                try {
                    const statusQuery = Bmob.Query('_User');
                    statusQuery.equalTo('dataType', '==', 'status');
                    statusRes = await statusQuery.find();
                } catch (e) {
                    console.log("查询开奖状态跳过", e);
                }
                
                if (statusRes.length > 0 && statusRes[0].isFinished) {
                    msgEl.style.color = "#e74c3c";
                    msgEl.innerText = "🛑 开奖已启动，提交通道已关闭！";
                    btn.innerText = "提交通道关闭";
                    return;
                }

                let existRecord = [];
                try {
                    const checkQuery = Bmob.Query('_User');
                    checkQuery.equalTo('username', '==', id);
                    existRecord = await checkQuery.find();
                } catch (e) {
                    console.log("查重跳过", e);
                }

                if (existRecord.length > 0) {
                    msgEl.style.color = "#e74c3c";
                    msgEl.innerText = "🛑 该学号/工号已提交过，每人仅限一次！";
                    btn.disabled = false;
                    btn.innerText = "重新提交";
                    return;
                }

                const recordQuery = Bmob.Query('_User');
                recordQuery.set('username', id);           
                recordQuery.set('password', '123456');     
                recordQuery.set('dataType', 'student');    
                recordQuery.set('realName', name);         
                recordQuery.set('sequence', seq);          
                await recordQuery.save();

                msgEl.style.color = "#27ae60";
                msgEl.innerText = `🎉 提交成功！数据已安全记录至云端。`;
                document.getElementById('inputName').disabled = true;
                document.getElementById('inputId').disabled = true;
                document.getElementById('inputSeq').disabled = true;
                
            } catch (error) {
                if (error && error.message && error.message.includes("Cannot convert undefined or null to object")) {
                    msgEl.style.color = "#27ae60";
                    msgEl.innerText = `🎉 提交成功！数据已安全记录至云端。`;
                    document.getElementById('inputName').disabled = true;
                    document.getElementById('inputId').disabled = true;
                    document.getElementById('inputSeq').disabled = true;
                    return;
                }

                console.error("提交失败:", error);
                msgEl.style.color = "#e74c3c";
                msgEl.innerText = "❌ 报错了: " + (error.message || JSON.stringify(error));
                btn.disabled = false;
                btn.innerText = "重新提交";
            }
        }

        async function checkAdminStatus() {
            try {
                const countQuery = Bmob.Query('_User');
                countQuery.equalTo('dataType', '==', 'student');
                const count = await countQuery.count();
                document.getElementById('adminStatus').innerText = `✅ 云端已连接。当前总计收集: ${count} 条序列`;
                document.getElementById('drawBtn').disabled = false;
            } catch (error) {
                document.getElementById('adminStatus').innerText = `❌ 连接失败: ${error.message || '未知错误'}`;
                document.getElementById('adminStatus').style.color = "red";
                document.getElementById('drawBtn').disabled = false; 
            }
        }

        async function adminStartDraw() {
            const btn = document.getElementById('drawBtn');
            btn.disabled = true;
            btn.innerText = "正在锁定云端数据库并开奖...";
            const targetSeq = "GCTTATGGA"; 

            try {
                const statusQuery = Bmob.Query('_User');
                statusQuery.equalTo('dataType', '==', 'status');
                const statusRes = await statusQuery.find();
                
                if (statusRes.length === 0) {
                    const newStatus = Bmob.Query('_User');
                    newStatus.set('username', 'admin_game_status'); 
                    newStatus.set('password', 'admin123456');
                    newStatus.set('dataType', 'status');
                    newStatus.set('isFinished', true);
                    newStatus.set('finalSeq', targetSeq);
                    await newStatus.save();
                } else {
                    const updateStatus = Bmob.Query('_User');
                    updateStatus.set('id', statusRes[0].objectId);
                    updateStatus.set('isFinished', true);
                    updateStatus.set('finalSeq', targetSeq);
                    await updateStatus.save();
                }
            } catch (error) {
                console.warn("更新状态报错，可能由于缓存引起", error);
            }
            
            executeDrawAnimation(targetSeq);
        }

        async function checkGameStatusFromCloud() {
            try {
                const statusQuery = Bmob.Query('_User');
                statusQuery.equalTo('dataType', '==', 'status');
                const statusRes = await statusQuery.find();
                
                if (statusRes.length > 0 && statusRes[0].isFinished && finalSequence === "") {
                    clearInterval(syncTimer); 
                    const targetSeq = statusRes[0].finalSeq;
                    finalSequence = targetSeq;
                    
                    document.getElementById('participantWait').style.display = 'none';
                    
                    const container = document.getElementById('ballsContainer');
                    container.innerHTML = "";
                    for (let i = 0; i < targetSeq.length; i++) {
                        const base = targetSeq[i];
                        const ball = document.createElement('div');
                        ball.className = `ball ${base} show`; 
                        ball.innerText = base;
                        container.appendChild(ball);
                    }
                    
                    await fetchCloudDataAndProcess();
                }
            } catch (error) {}
        }

        function executeDrawAnimation(targetSeq) {
            document.getElementById('resultSection').style.display = "none";
            const container = document.getElementById('ballsContainer');
            container.innerHTML = "";
            finalSequence = "";
            
            let i = 0;
            const drawInterval = setInterval(async () => {
                if (i >= 9) {
                    clearInterval(drawInterval);
                    document.getElementById('drawBtn').innerText = "✅ 开奖完毕";
                    await fetchCloudDataAndProcess(); 
                    return;
                }
                const base = targetSeq[i];
                finalSequence += base;
                
                const ball = document.createElement('div');
                ball.className = `ball ${base}`;
                ball.innerText = base;
                container.appendChild(ball);
                setTimeout(() => ball.classList.add('show'), 50);
                i++;
            }, 800);
        }

        async function fetchCloudDataAndProcess() {
            try {
                const query = Bmob.Query('_User');
                query.equalTo('dataType', '==', 'student');
                query.limit(1000); 
                const results = await query.find();

                currentResults = results.map(user => {
                    const distance = getLevenshteinDistance(finalSequence, user.sequence);
                    return { 
                        name: user.realName, 
                        id: user.username,
                        seq: user.sequence, 
                        homology: ((9 - distance) / 9) * 100 
                    };
                });

                document.getElementById('resultSection').style.display = "block";
                switchTab('high'); 
            } catch (error) {
                console.error("拉取数据失败", error);
            }
        }

        function getLevenshteinDistance(a, b) {
            const matrix = [];
            for (let i = 0; i <= b.length; i++) { matrix[i] = [i]; }
            for (let j = 0; j <= a.length; j++) { matrix[0][j] = j; }
            for (let i = 1; i <= b.length; i++) {
                for (let j = 1; j <= a.length; j++) {
                    if (b.charAt(i - 1) === a.charAt(j - 1)) {
                        matrix[i][j] = matrix[i - 1][j - 1];
                    } else {
                        matrix[i][j] = Math.min(matrix[i - 1][j - 1] + 1, matrix[i][j - 1] + 1, matrix[i - 1][j] + 1);
                    }
                }
            }
            return matrix[b.length][a.length];
        }

        function switchTab(type) {
            document.getElementById('tabHigh').classList.remove('active');
            document.getElementById('tabLow').classList.remove('active');
            if (type === 'high') {
                document.getElementById('tabHigh').classList.add('active');
                currentResults.sort((a, b) => b.homology - a.homology);
            } else {
                document.getElementById('tabLow').classList.add('active');
                currentResults.sort((a, b) => a.homology - b.homology);
            }
            const tbody = document.getElementById('resultBody');
            tbody.innerHTML = "";
            currentResults.forEach((user, index) => {
                tbody.innerHTML += `<tr><td>${index + 1}</td><td>${user.name}</td><td>${user.id}</td><td class="seq-font">${user.seq}</td><td><b>${user.homology.toFixed(2)}%</b></td></tr>`;
            });
        }

        window.onload = initPage;
    </script>
</body>
</html>
