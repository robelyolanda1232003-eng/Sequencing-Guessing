<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生命科学学院2026本科生毕业典礼 - 序列竞猜</title>
    <script src="https://imgcache.qq.com/qcloud/cloudbase-js-sdk/1.7.0/cloudbase.full.js"></script>
    <style>
        :root { --primary-color: #2c3e50; --accent-color: #27ae60; --bg-color: #f4f7f6; --disabled-color: #bdc3c7; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); color: var(--primary-color); max-width: 800px; margin: 0 auto; padding: 20px; }
        h1, h2 { text-align: center; }
        .card { background: white; border-radius: 10px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-family: monospace; }
        button { background-color: var(--accent-color); color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; width: 100%; transition: background-color 0.3s; font-weight: bold; }
        button:hover:not(:disabled) { background-color: #219653; }
        button:disabled { background-color: var(--disabled-color); cursor: not-allowed; }
        .balls-container { display: flex; justify-content: center; gap: 10px; margin: 30px 0; min-height: 60px; }
        .ball { width: 50px; height: 50px; border-radius: 50%; background: linear-gradient(135deg, #3498db, #2980b9); color: white; font-size: 24px; font-weight: bold; display: flex; align-items: center; justify-content: center; box-shadow: inset -3px -3px 6px rgba(0,0,0,0.2), 3px 3px 6px rgba(0,0,0,0.2); opacity: 0; transform: scale(0.5); transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .ball.show { opacity: 1; transform: scale(1); }
        .ball.A { background: linear-gradient(135deg, #e74c3c, #c0392b); }
        .ball.T { background: linear-gradient(135deg, #f1c40f, #f39c12); }
        .ball.C { background: linear-gradient(135deg, #2ecc71, #27ae60); }
        .ball.G { background: linear-gradient(135deg, #3498db, #2980b9); }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #ecf0f1; }
        .seq-font { font-family: 'Courier New', Courier, monospace; letter-spacing: 1px; }
        .tabs { display: flex; gap: 10px; margin-bottom: 10px; }
        .tab-btn { background-color: #ecf0f1; color: var(--primary-color); width: auto; }
        .tab-btn.active { background-color: var(--primary-color); color: white; }
    </style>
</head>
<body>

    <h1>🧬 序列竞猜大挑战</h1>

    <div class="card" id="submitSection">
        <h2>自定义序列提交</h2>
        <div class="form-group"><label>姓名</label><input type="text" id="inputName"></div>
        <div class="form-group"><label>学号/工号</label><input type="text" id="inputId"></div>
        <div class="form-group"><label>自定义 ssDNA (严格 9nt)</label><input type="text" id="inputSeq" maxlength="9" style="text-transform: uppercase;"></div>
        <button id="submitBtn" onclick="submitSequence()" disabled>系统初始化中...</button>
        <p id="submitMsg" style="text-align: center; margin-top: 10px; font-weight: bold;"></p>
    </div>

    <div class="card">
        <h2>现场最终序列开奖</h2>
        
        <div id="adminControls" style="display: none;">
            <p id="adminStatus" style="color:#2980b9; font-weight:bold;">正在连接腾讯云数据库...</p>
            <button id="drawBtn" onclick="adminStartDraw()" disabled>🎲 读取云端数据并开奖</button>
            <button onclick="resetCloudData()" style="background-color: #e74c3c; margin-top: 10px;">⚠️ 重置云端所有数据(测试用)</button>
        </div>
        
        <div id="participantWait" style="text-align: center; color: #e74c3c; font-weight: bold;">
            <p id="waitText">⏳ 序列将加密上传至腾讯云。请留意现场大屏幕，开奖后将同步结果...</p>
        </div>

        <div class="balls-container" id="ballsContainer"></div>
    </div>

    <div class="card" id="resultSection" style="display: none;">
        <h2>两轮获奖排行榜</h2>
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('high')" id="tabHigh">第一轮获奖：最高同源性</button>
            <button class="tab-btn" onclick="switchTab('low')" id="tabLow">第二轮获奖：最低同源性</button>
        </div>
        <table id="resultTable">
            <thead><tr><th>排名</th><th>姓名</th><th>学号/工号</th><th>提交序列</th><th>同源性</th></tr></thead>
            <tbody id="resultBody"></tbody>
        </table>
    </div>

    <script>
        // ==========================================
        // ⚠️ 极其重要：在这里填入你的腾讯云开发 环境ID
        // ==========================================
        const app = cloudbase.init({
            env: tsuma01-d9gkvyqmsc001e482 // 例如: bio-lottery-1a2b3c4d
        });
        const auth = app.auth();
        const db = app.database();
        // ==========================================

        let currentResults = [];
        let finalSequence = "";
        let syncTimer = null;
        let isAdmin = false;

        // --- 页面初始化与匿名登录 ---
        async function initPage() {
            try {
                // 腾讯云开发要求必须先进行匿名登录才能操作数据库
                await auth.anonymousAuthProvider().signIn();
                document.getElementById('submitBtn').innerText = "提交我的序列";
                document.getElementById('submitBtn').disabled = false;
                
                const urlParams = new URLSearchParams(window.location.search);
                isAdmin = urlParams.get('admin') === 'true';

                if (isAdmin) {
                    document.getElementById('adminControls').style.display = 'block';
                    document.getElementById('participantWait').style.display = 'none';
                    checkAdminStatus();
                } else {
                    document.getElementById('adminControls').style.display = 'none';
                    document.getElementById('participantWait').style.display = 'block';
                    syncTimer = setInterval(checkGameStatusFromCloud, 3000);
                }
                
                checkGameStatusFromCloud();
            } catch (error) {
                document.getElementById('submitBtn').innerText = "云服务连接失败";
                alert("初始化失败，请确保云开发控制台已开启【匿名登录】。错误信息: " + error.message);
            }
        }

        // --- 学生提交数据 ---
        async function submitSequence() {
            const name = document.getElementById('inputName').value.trim();
            const id = document.getElementById('inputId').value.trim();
            let seq = document.getElementById('inputSeq').value.trim().toUpperCase();
            const msgEl = document.getElementById('submitMsg');
            const btn = document.getElementById('submitBtn');

            if (!name || !id || !seq || seq.length !== 9 || !/^[ATCG]+$/.test(seq)) {
                alert("输入无效，请检查信息格式！"); return;
            }

            btn.disabled = true;
            btn.innerText = "上传云端中...";

            try {
                // 1. 检查开奖状态
                const statusRes = await db.collection('GameStatus').where({ key: 'main' }).get();
                if (statusRes.data.length > 0 && statusRes.data[0].isFinished) {
                    msgEl.style.color = "#e74c3c";
                    msgEl.innerText = "🛑 开奖已启动，提交通道已关闭！";
                    btn.innerText = "提交通道关闭";
                    return;
                }

                // 2. 防查重
                const checkRes = await db.collection('SequenceData').where({ studentId: id }).get();
                if (checkRes.data.length > 0) {
                    msgEl.style.color = "#e74c3c";
                    msgEl.innerText = "🛑 该学号/工号已提交过，每人仅限一次！";
                    btn.disabled = false;
                    btn.innerText = "重新提交";
                    return;
                }

                // 3. 写入数据库
                await db.collection('SequenceData').add({
                    name: name,
                    studentId: id,
                    sequence: seq,
                    timestamp: db.serverDate()
                });

                msgEl.style.color = "#27ae60";
                msgEl.innerText = `🎉 提交成功！序列已接入腾讯云。`;
                document.getElementById('inputName').disabled = true;
                document.getElementById('inputId').disabled = true;
                document.getElementById('inputSeq').disabled = true;
                
            } catch (error) {
                console.error("提交失败:", error);
                msgEl.style.color = "#e74c3c";
                msgEl.innerText = "❌ 权限或网络错误，提交失败。请检查数据库读写权限。";
                btn.disabled = false;
                btn.innerText = "提交我的序列";
            }
        }

        // --- 管理员检查当前云端人数 ---
        async function checkAdminStatus() {
            try {
                const countRes = await db.collection('SequenceData').count();
                document.getElementById('adminStatus').innerText = `✅ 腾讯云已连接。当前总计收集: ${countRes.total} 条序列`;
                document.getElementById('drawBtn').disabled = false;
            } catch (error) {
                document.getElementById('adminStatus').innerText = `❌ 连接失败，请检查数据库权限是否正确设置。`;
                document.getElementById('adminStatus').style.color = "red";
            }
        }

        // --- 管理员执行开奖 ---
        async function adminStartDraw() {
            const btn = document.getElementById('drawBtn');
            btn.disabled = true;
            btn.innerText = "正在锁定云端数据库并开奖...";

            const targetSeq = "GCTTATGGA"; // 开奖最终序列

            try {
                // 更新云端开奖状态
                const statusRes = await db.collection('GameStatus').where({ key: 'main' }).get();
                if (statusRes.data.length === 0) {
                    await db.collection('GameStatus').add({
                        key: 'main',
                        isFinished: true,
                        finalSeq: targetSeq
                    });
                } else {
                    await db.collection('GameStatus').doc(statusRes.data[0]._id).update({
                        isFinished: true,
                        finalSeq: targetSeq
                    });
                }

                // 本地执行动画
                executeDrawAnimation(targetSeq);
            } catch (error) {
                alert("控制云端状态失败：" + error.message);
                btn.disabled = false;
            }
        }

        // --- 学生手机轮询云端状态 ---
        async function checkGameStatusFromCloud() {
            try {
                const statusRes = await db.collection('GameStatus').where({ key: 'main' }).get();
                
                if (statusRes.data.length > 0 && statusRes.data[0].isFinished && finalSequence === "") {
                    clearInterval(syncTimer); 
                    const targetSeq = statusRes.data[0].finalSeq;
                    finalSequence = targetSeq;
                    document.getElementById('participantWait').style.display = 'none';
                    await fetchCloudDataAndProcess();
                }
            } catch (error) {
                console.error("同步状态失败");
            }
        }

        // --- 开奖动画逻辑 (大屏展示) ---
        function executeDrawAnimation(targetSeq) {
            document.getElementById('resultSection').style.display = "none";
            const container = document.getElementById('ballsContainer');
            container.innerHTML = "";
            finalSequence = "";
            
            let i = 0;
            const drawInterval = setInterval(async () => {
                if (i >= 9) {
                    clearInterval(drawInterval);
                    document.getElementById('drawBtn').innerText = "✅ 开奖完毕";
                    await fetchCloudDataAndProcess(); 
                    return;
                }
                const base = targetSeq[i];
                finalSequence += base;
                
                const ball = document.createElement('div');
                ball.className = `ball ${base}`;
                ball.innerText = base;
                container.appendChild(ball);
                setTimeout(() => ball.classList.add('show'), 50);
                i++;
            }, 800);
        }

        // --- 拉取数据与比对 ---
        async function fetchCloudDataAndProcess() {
            try {
                const res = await db.collection('SequenceData').limit(1000).get();
                const allUsers = res.data;

                currentResults = allUsers.map(user => {
                    const distance = getLevenshteinDistance(finalSequence, user.sequence);
                    return { 
                        name: user.name, 
                        id: user.studentId, 
                        seq: user.sequence, 
                        homology: ((9 - distance) / 9) * 100 
                    };
                });

                document.getElementById('resultSection').style.display = "block";
                switchTab('high'); 
            } catch (error) {
                alert("获取云端排名数据失败：" + error.message);
            }
        }

        // --- 同源性算法 ---
        function getLevenshteinDistance(a, b) {
            const matrix = [];
            for (let i = 0; i <= b.length; i++) { matrix[i] = [i]; }
            for (let j = 0; j <= a.length; j++) { matrix[0][j] = j; }
            for (let i = 1; i <= b.length; i++) {
                for (let j = 1; j <= a.length; j++) {
                    if (b.charAt(i - 1) === a.charAt(j - 1)) {
                        matrix[i][j] = matrix[i - 1][j - 1];
                    } else {
                        matrix[i][j] = Math.min(matrix[i - 1][j - 1] + 1, matrix[i][j - 1] + 1, matrix[i - 1][j] + 1);
                    }
                }
            }
            return matrix[b.length][a.length];
        }

        function switchTab(type) {
            document.getElementById('tabHigh').classList.remove('active');
            document.getElementById('tabLow').classList.remove('active');
            if (type === 'high') {
                document.getElementById('tabHigh').classList.add('active');
                currentResults.sort((a, b) => b.homology - a.homology);
            } else {
                document.getElementById('tabLow').classList.add('active');
                currentResults.sort((a, b) => a.homology - b.homology);
            }
            const tbody = document.getElementById('resultBody');
            tbody.innerHTML = "";
            currentResults.forEach((user, index) => {
                tbody.innerHTML += `<tr><td>${index + 1}</td><td>${user.name}</td><td>${user.id}</td><td class="seq-font">${user.seq}</td><td><b>${user.homology.toFixed(2)}%</b></td></tr>`;
            });
        }

        // --- 调试工具：重置数据 ---
        async function resetCloudData() {
            if (!confirm("⚠️ 确定要清空云端的所有数据吗？（注：由于腾讯云 SDK 限制，前端批量删除权限较严，此功能可能因权限被拒，推荐直接在云控制台操作删除）")) return;
            try {
                // 腾讯云开发前端匿名环境通常没有直接清空集合的权限
                // 这里提供单条尝试删除的逻辑，最稳妥的是去控制台手动清空数据
                const statusRes = await db.collection('GameStatus').get();
                for(let item of statusRes.data) { await db.collection('GameStatus').doc(item._id).remove(); }
                
                const dataRes = await db.collection('SequenceData').get();
                for(let item of dataRes.data) { await db.collection('SequenceData').doc(item._id).remove(); }
                
                alert("云端数据已尝试清空！页面将刷新。");
                location.reload();
            } catch(e) {
                alert("清空失败，出于安全机制，请登录腾讯云开发控制台，在【数据库】后台直接全选并删除数据。");
            }
        }

        window.onload = initPage;
    </script>
</body>
</html>
